<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Harness - Primitive Components</title>
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/app.css" />
  <style>
    /* simple layout */
    body { padding: 16px; font-family: var(--font-ui); }
  </style>
</head>
<body>
  <!-- Buttons -->
  <button class="btn primary">Primary</button>
  <button class="btn secondary">Secondary</button>
  <button class="btn quiet">Quiet</button>
  <button class="btn danger">Danger</button>
  <button class="btn primary" disabled>Disabled</button>
  <button class="btn primary is-loading" aria-busy="true">Loading</button>

  <!-- Field -->
  <div class="field" aria-label="name-field">
    <label>Name</label>
    <input type="text" />
    <span class="help">help text</span>
  </div>
  <div class="field" aria-label="error-field">
    <textarea></textarea>
    <span class="error">Error</span>
  </div>

  <!-- Checks / Switch -->
  <div class="check"><input type="checkbox" checked/> <span>Check</span></div>
  <div class="switch"><input type="checkbox"/> <span>Switch</span></div>

  <!-- Cards / Rows / Badges / Stamps -->
  <div class="card">Card</div>
  <div class="card-elevated">Elevated Card</div>
  <div class="row">Row item</div>
  <span class="badge">Badge</span>
  <span class="stamp rarity-common">Stamp</span>
  <span class="stamp rarity-epic">Stamp</span>
  <span class="stamp locked rarity-rare">Stamp</span>

  <!-- Stat / Progress / Chart / Table -->
  <span class="stat">Stat</span>
  <div class="progress" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><span style="width:60%"></span></div>
  <div class="chart">Chart</div>
  <table class="table">
    <tr><th>Col</th><th>Val</th></tr>
    <tr><td>A</td><td>1</td></tr>
  </table>
  <div class="empty">Nothing here</div>
  <div class="skeleton" style="width: 120px"></div>

  <!-- Banner / Dialog / Sheet / Toast / Status -->
  <div class="banner info">Info banner</div>
  <div class="banner success">Success banner</div>
  <div class="banner warning">Warning banner</div>
  <div class="banner error">Error banner</div>
  <div class="dialog">Dialog</div>
  <div class="sheet">Sheet</div>
  <div class="toast">Toast</div>
  <div class="status">Status</div>

  <!-- Tabs / Calendar -->
  <div class="tabs">
    <div class="nav-item">Tab 1</div>
    <div class="nav-item">Tab 2</div>
  </div>
  <div class="calendar">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const checks = [];
      const requiredSelectors = [
        '.btn', '.field', '.check', '.switch', '.card', '.card-elevated', '.row', '.badge', '.stamp', '.stamp.rarity-common', '.stamp.rarity-epic', '.stat', '[role="progressbar"]', '.chart', '.table', '.empty', '.skeleton', '.banner.info', '.banner.success', '.banner.warning', '.banner.error', '.dialog', '.sheet', '.toast', '.status', '.tabs', '.nav-item', '.calendar'
      ];
      let allPresent = true;
      requiredSelectors.forEach(sel => {
        const el = document.querySelector(sel);
        const ok = !!el;
        checks.push({name: sel, ok, detail: ok ? 'present' : 'missing'});
        if (!ok) allPresent = false;
      });
      const progresses = document.querySelectorAll('[role="progressbar"]');
      checks.push({name:'progressbar', ok: progresses.length>0, detail: progresses.length+ ' instance(s)'});
      // Stamp borders present implied by existence of stamps above.
      window.__HARNESS__ = { ok: allPresent && progresses.length>0, checks };
    });
  </script>
</body>
</html>
