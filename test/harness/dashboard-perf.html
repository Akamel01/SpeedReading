<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>dashboard perf harness</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="../../styles/app.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createDashboard } from '../../src/ui/dashboard.js';

    // Deterministic 1000-session fixture (mulberry32, fixed seed).
    const mulberry32 = (a) => () => {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const rand = mulberry32(7);
    const base = new Date('2025-06-01T00:00:00Z').getTime();
    const sessions = [];
    for (let i = 0; i < 1000; i++) {
      const startedAt = base + i * 3600 * 1000;
      sessions.push({
        id: `p${i}`, kind: i === 0 ? 'baseline' : 'read', textId: 't1',
        chapterIndex: 0, chunkSize: 1 + (i % 3), targetWpm: 300,
        startedAt, endedAt: startedAt + 120000,
        wordCount: Math.floor(300 + rand() * 700),
        elapsedMs: 120000, wpm: Math.floor(160 + rand() * 240),
        quizId: null,
        correct: null, total: null,
        comprehensionPct: rand() < 0.7 ? Math.floor(60 + rand() * 40) : null,
      });
    }

    const view = createDashboard(document.getElementById('root'), {});
    const t0 = performance.now();
    view.render({ sessions, quizzes: [], suggestion: null });
    const renderMs = performance.now() - t0;
    const rows = document.querySelectorAll('#root .dashboard-table tr').length;

    window.__HARNESS__ = {
      ok: true,
      checks: [
        { name: 'renderMs', ok: renderMs < 100, detail: `${Math.round(renderMs * 10) / 10}ms for 1000 sessions` },
        { name: 'recent-50 cap', ok: rows <= 51, detail: `${rows} table rows (header + ≤50)` },
        { name: 'trends present', ok: !!document.querySelector('#root .viz-chart') && !!document.querySelector('#root .words-bars'), detail: 'chart + bars' },
        { name: 'records present', ok: document.querySelectorAll('#root .record-item').length === 10, detail: '10 records' },
      ],
    };
  </script>
</body>
</html>
